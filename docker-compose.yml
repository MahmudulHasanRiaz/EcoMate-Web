networks:
  ecomate-network:
    driver: bridge

volumes:
  postgres-data:
  uploads-data:
  backup-data:
  redis-data:
  mobile-builds-data:
  # Holds the generated encryption key for the license, attendance device
  # credentials and marketing OAuth tokens. Separate from uploads, backups and
  # mobile builds so nothing else in the container can read it. Losing this
  # volume makes that data permanently unreadable.
  license-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - ecomate-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ecomate_web}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    networks:
      - ecomate-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M

  backend:
    image: ghcr.io/${DOCKER_REGISTRY_OWNER:-mahmudulhasanriaz}/ecomate-backend:latest
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - ecomate-network
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - uploads-data:/app/uploads
      - backup-data:/app/backup-storage
      - mobile-builds-data:/app/mobile-builds
      - license-data:/app/license-data
    environment:
      NODE_ENV: production
      CLIENT_DOMAIN: ${CLIENT_DOMAIN}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ecomate_web}}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      LICENSE_ENCRYPTION_KEY: ${LICENSE_ENCRYPTION_KEY:-}
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-}
      # Shared secret for storefront on-demand revalidation (P4). The backend
      # will present it to POST /api/revalidate after product/config mutations
      # (hookup pending); the storefront endpoint stays disabled until set.
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://${CLIENT_DOMAIN:-mac.riaz.com.bd}}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,https://${CLIENT_DOMAIN:-mac.riaz.com.bd}}
      APP_URL: ${APP_URL:-https://${CLIENT_DOMAIN:-mac.riaz.com.bd}}
      STOREFRONT_URL: ${STOREFRONT_URL:-https://${CLIENT_DOMAIN:-mac.riaz.com.bd}}
      BACKUP_MAX_UPLOAD_BYTES: ${BACKUP_MAX_UPLOAD_BYTES:-107374182400}
      BACKUP_MAX_RESTORE_BYTES: ${BACKUP_MAX_RESTORE_BYTES:-107374182400}
      BACKUP_STORAGE_DIR: ${BACKUP_STORAGE_DIR:-/app/backup-storage}
      BACKUP_WORK_DIR: ${BACKUP_WORK_DIR:-/app/backup-storage/work}
      BACKUP_R2_ENDPOINT: ${BACKUP_R2_ENDPOINT:-}
      BACKUP_R2_ACCESS_KEY: ${BACKUP_R2_ACCESS_KEY:-}
      BACKUP_R2_SECRET_KEY: ${BACKUP_R2_SECRET_KEY:-}
      BACKUP_R2_BUCKET: ${BACKUP_R2_BUCKET:-}
      BACKUP_DUMP_TIMEOUT: ${BACKUP_DUMP_TIMEOUT:-1800000}
      BACKUP_ARCHIVE_TIMEOUT: ${BACKUP_ARCHIVE_TIMEOUT:-7200000}
      BACKUP_RESTORE_TIMEOUT: ${BACKUP_RESTORE_TIMEOUT:-86400000}
      BACKUP_WRITE_DRAIN_TIMEOUT: ${BACKUP_WRITE_DRAIN_TIMEOUT:-7200000}
      BACKUP_QUEUE_DRAIN_TIMEOUT: ${BACKUP_QUEUE_DRAIN_TIMEOUT:-7200000}
      BACKUP_DOWNLOAD_TTL_MS: ${BACKUP_DOWNLOAD_TTL_MS:-3600000}
      BACKUP_RESTORE_DATABASE_URL: ${BACKUP_RESTORE_DATABASE_URL:-}
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      TIKTOK_PIXEL_CODE: ${TIKTOK_PIXEL_CODE:-}
      TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
      GA_API_SECRET: ${GA_API_SECRET:-}
      GA_ADS_CONVERSION_ID: ${GA_ADS_CONVERSION_ID:-}
      GA_ADS_CONVERSION_LABEL: ${GA_ADS_CONVERSION_LABEL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DUMMY_DATA: ${SEED_DUMMY_DATA:-false}
      RUN_SEED: ${RUN_SEED:-false}
      # Scale-test seeder opt-in (staging only — never set on a client
      # stack). Empty default = off. startup.sh + the script itself both
      # gate on ALLOW_SCALE_SEED=1, and the script also refuses known
      # client production domains unconditionally.
      ALLOW_SCALE_SEED: ${ALLOW_SCALE_SEED:-}
      # NOTE: STOCK_RECONCILE_ON_BOOT was REMOVED 2026-10-30 — boot-time
      # auto-heal no longer exists; reconciliation is explicit-only
      # (reconcile-stock.ts / admin Inventory → Reconciliation page).
      # Node heap ceiling, consumed by startup.sh. Must stay below the container
      # memory limit set in the deploy block below, or the kernel OOM-kills the
      # process before Node reaches its own ceiling.
      NODE_MAX_OLD_SPACE_SIZE: ${NODE_MAX_OLD_SPACE_SIZE:-1280}
      # Where the generated encryption key is persisted when
      # LICENSE_ENCRYPTION_KEY is not supplied by the environment.
      LICENSE_DATA_DIR: /app/license-data
      # Tracking-store retention sweep (90d PII anonymisation / 30d terminal
      # outbox purge / 2y archive). Only the literal 'false' disables it.
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      # Mobile Build (optional — only if client has mobile license)
      MOBILE_BUILDER_GITHUB_TOKEN: ${MOBILE_BUILDER_GITHUB_TOKEN:-}
      MOBILE_BUILDER_CALLBACK_TOKEN: ${MOBILE_BUILDER_CALLBACK_TOKEN:-}
      MOBILE_BUILDER_REPO: ${MOBILE_BUILDER_REPO:-EcoMate-Mobile-Builder}
      GITHUB_REPOSITORY_OWNER: ${GITHUB_REPOSITORY_OWNER:-mahmudulhasanriaz}
      MOBILE_BUILD_DIR: ${MOBILE_BUILD_DIR:-./mobile-builds}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          # Raised from 512M: startup died with "JavaScript heap out of memory"
          # while Prisma loaded the 186-table schema. Node's heap has to fit
          # inside this limit, otherwise the kernel OOM-kills the process before
          # Node's own ceiling is reached. startup.sh sets --max-old-space-size
          # to 1280, leaving ~256M for the container's non-heap allocations
          # (Prisma engine, buffers, native).
          memory: 1536M
        reservations:
          memory: 512M

  # backend-migrate is removed — migrations run automatically in backend service startup.sh

  storefront:
    image: ghcr.io/${DOCKER_REGISTRY_OWNER:-mahmudulhasanriaz}/ecomate-storefront:latest
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - ecomate-network
    ports:
      - "${STOREFRONT_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      API_URL: ${API_URL:-http://backend:4000/api}
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-}
      # Guards POST /api/revalidate (on-demand cache invalidation, P4).
      # Leave empty to keep the endpoint disabled (401 for every call).
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:-}
      NEXT_PUBLIC_API_URL: ${STORE_NEXT_PUBLIC_API_URL:-https://${CLIENT_DOMAIN:-mac.riaz.com.bd}/api}
      NEXT_PUBLIC_STOREFRONT_URL: ${STORE_NEXT_PUBLIC_STOREFRONT_URL:-https://${CLIENT_DOMAIN:-mac.riaz.com.bd}}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      NEXT_PUBLIC_GA_ADS_CONVERSION_ID: ${NEXT_PUBLIC_GA_ADS_CONVERSION_ID:-}
      POS_URL: ${POS_URL:-http://pos:80}
      # Round-3 perf: /uploads bytes are served by the media-static nginx
      # container (sendfile), not proxied through the backend Node process.
      # Rollback knob: set UPLOADS_URL=http://backend:4000 in the stack env
      # to restore the previous behaviour (backend serves the bytes).
      UPLOADS_URL: ${UPLOADS_URL:-http://media-static:80}
    depends_on:
      backend:
        # Wait until the backend has finished its boot migrations and
        # /api/health passes — starting earlier leaves the storefront
        # serving pages whose API is still down (post-redeploy PDP
        # errors, 2026-11-03).
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M

  admin:
    image: ghcr.io/${DOCKER_REGISTRY_OWNER:-mahmudulhasanriaz}/ecomate-admin:latest
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - ecomate-network
    ports:
      - "${ADMIN_PORT:-8080}:80"
    environment:
      VITE_API_URL: ${ADMIN_VITE_API_URL:-/api}
      VITE_BASE: ${ADMIN_VITE_BASE:-/admin/}
      # POS Terminal sidebar link (e.g. https://pos.xyz.com/pos). Empty =
      # auto-detect (admin.* host -> pos.* host, localhost -> :5174).
      VITE_POS_URL: ${ADMIN_VITE_POS_URL:-}
    depends_on:
      backend:
        # Wait until the backend has finished its boot migrations and
        # /api/health passes — starting earlier leaves the storefront
        # serving pages whose API is still down (post-redeploy PDP
        # errors, 2026-11-03).
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80${ADMIN_VITE_BASE:-/admin/}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M

  pos:
    image: ghcr.io/${DOCKER_REGISTRY_OWNER:-mahmudulhasanriaz}/ecomate-pos:latest
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - ecomate-network
    ports:
      - "${POS_PORT:-8081}:80"
    depends_on:
      backend:
        # Wait until the backend has finished its boot migrations and
        # /api/health passes — starting earlier leaves the storefront
        # serving pages whose API is still down (post-redeploy PDP
        # errors, 2026-11-03).
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/pos/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M

  # Round-3 perf (2026-11-03): static media server. Serves the uploads
  # volume with nginx sendfile so image bytes never occupy the backend's
  # single CPU. The storefront's /uploads rewrite targets this service
  # (UPLOADS_URL); the backend keeps serving /uploads on its own origin
  # for direct API consumers, with identical headers.
  #
  # The nginx config is INLINE (env + entrypoint) on purpose: a single-file
  # bind mount of a repo file (./portainer/media-static.conf) broke the
  # Portainer git-stack deploy on 2026-11-03 — the host path did not exist
  # as a file in Portainer's compose dir, Docker auto-created it as a
  # directory, and the mount onto /etc/nginx/conf.d/default.conf failed,
  # taking the whole stack down. Never bind-mount repo files in this stack.
  #
  # Header parity with the backend's @fastify/static setup
  # (apps/backend/src/main.ts) is REQUIRED — do not drift:
  #   * every response: Content-Security-Policy: sandbox +
  #     X-Content-Type-Options: nosniff (security audit F15)
  #   * /uploads/derivatives/*: max-age=31536000, immutable
  #   * other originals: max-age=3600 (a restore can replace an original's
  #     bytes at the same URL — never pin those)
  # In the config below, $$ is compose escaping for a literal $.
  media-static:
    image: nginx:stable-alpine
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - ecomate-network
    volumes:
      - uploads-data:/srv/uploads:ro
    environment:
      MEDIA_STATIC_CONF: |
        server {
            listen 80;
            server_name _;
            root /srv;
            sendfile on;
            tcp_nopush on;
            access_log off;
            location /uploads/derivatives/ {
                try_files $$uri =404;
                add_header Content-Security-Policy "sandbox" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Cache-Control "public, max-age=31536000, immutable" always;
            }
            location /uploads/ {
                try_files $$uri =404;
                add_header Content-Security-Policy "sandbox" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Cache-Control "public, max-age=3600" always;
            }
            location / {
                return 404;
            }
        }
    entrypoint: ["sh", "-c", "printf '%s' \"$$MEDIA_STATIC_CONF\" > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 32M
