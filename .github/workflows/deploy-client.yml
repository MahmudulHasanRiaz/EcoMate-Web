name: Deploy Client

# MANUAL deployment only — CI never deploys. Tick All or one or more clients,
# run, and each selected stack is redeployed via its Portainer webhook (which
# pulls the images CI already built). Nothing here builds anything.
on:
  workflow_dispatch:
    inputs:
      all:
        description: 'Deploy ALL clients in one click?'
        required: false
        default: false
        type: boolean
      ecomate_web:
        description: 'Deploy main stack (ecomate-web)?'
        required: false
        default: false
        type: boolean
      fixedplus:
        description: 'Deploy FIXEDPLUS?'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    name: Manual deploy
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 15
    steps:
      - name: Validate selection
        run: |
          if [ "${{ inputs.all }}" != "true" ] && [ "${{ inputs.ecomate_web }}" != "true" ] && [ "${{ inputs.fixedplus }}" != "true" ]; then
            echo "No client selected — tick All or at least one client."
            exit 1
          fi

      - name: Deploy ecomate-web
        if: inputs.all == true || inputs.ecomate_web == true
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_ECOMATE_WEB }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "No webhook secret PORTAINER_WEBHOOK_ECOMATE_WEB configured."
            exit 1
          fi
          echo "Triggering Portainer Stack Redeploy for ecomate-web..."
          RESPONSE_FILE=/tmp/response-ecomate-web.txt
          MAX_TRIES=3
          TRY=1
          HTTP_CODE=0
          while [ $TRY -le $MAX_TRIES ]; do
            echo "Attempt $TRY of $MAX_TRIES..."
            HTTP_CODE=$(curl -w "%{http_code}" -s -S -o "$RESPONSE_FILE" -X POST -k --max-time 30 "$WEBHOOK_URL") || HTTP_CODE=0
            echo "HTTP Status Code: $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Deployment triggered successfully for ecomate-web! (HTTP $HTTP_CODE)"
              break
            fi
            if [ $TRY -lt $MAX_TRIES ]; then sleep $((2 ** (TRY - 1))); fi
            TRY=$((TRY + 1))
          done
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Deployment completed (HTTP $HTTP_CODE)."
          else
            echo "Webhook request failed for ecomate-web after ${MAX_TRIES} attempts! (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Deploy FIXEDPLUS
        if: inputs.all == true || inputs.fixedplus == true
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_FIXEDPLUS }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "No webhook secret PORTAINER_WEBHOOK_FIXEDPLUS configured."
            exit 1
          fi
          echo "Triggering Portainer Stack Redeploy for FIXEDPLUS..."
          RESPONSE_FILE=/tmp/response-fixedplus.txt
          MAX_TRIES=3
          TRY=1
          HTTP_CODE=0
          while [ $TRY -le $MAX_TRIES ]; do
            echo "Attempt $TRY of $MAX_TRIES..."
            HTTP_CODE=$(curl -w "%{http_code}" -s -S -o "$RESPONSE_FILE" -X POST -k --max-time 30 "$WEBHOOK_URL") || HTTP_CODE=0
            echo "HTTP Status Code: $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Deployment triggered successfully for FIXEDPLUS! (HTTP $HTTP_CODE)"
              break
            fi
            if [ $TRY -lt $MAX_TRIES ]; then sleep $((2 ** (TRY - 1))); fi
            TRY=$((TRY + 1))
          done
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Deployment completed (HTTP $HTTP_CODE)."
          else
            echo "Webhook request failed for FIXEDPLUS after ${MAX_TRIES} attempts! (HTTP $HTTP_CODE)"
            exit 1
          fi
