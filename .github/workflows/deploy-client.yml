name: Deploy Client

# MANUAL deployment only — CI never deploys. Tick All or tick one/more
# client checkboxes, and each selected stack is redeployed via its Portainer
# webhook (which pulls the images CI already built). Nothing here builds
# anything.
#
# Adding a client = 1 line in .github/clients.json + 1 checkbox input below
# (same key) + 1 GitHub secret. The resolve/deploy jobs NEVER change.
#
# Deploy always runs on GitHub-hosted ubuntu (curl-only job — no reason to
# occupy the self-hosted Mac). Image builds (ci.yml) stay runner-selectable.
on:
  workflow_dispatch:
    inputs:
      all:
        description: 'Deploy ALL clients in one click?'
        required: false
        default: false
        type: boolean
      ecomate_web:
        description: 'Deploy ecomate-web (main stack)?'
        required: false
        default: false
        type: boolean
      fixedplus:
        description: 'Deploy FIXEDPLUS?'
        required: false
        default: false
        type: boolean
      avelto:
        description: 'Deploy Avelto BD?'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve clients
    runs-on: [ubuntu-latest]
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Pick clients
        id: pick
        env:
          # Whole inputs object as JSON: checkbox values arrive as 'true'/'false'
          # strings. Keys matching clients.json are honoured — new clients need
          # no change here, only their checkbox input above.
          ALL: ${{ inputs.all }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'EOF'
          import json, os
          with open('.github/clients.json') as f:
              clients = json.load(f)
          ticked = json.loads(os.environ.get('INPUTS_JSON', '{}'))
          if os.environ.get('ALL') == 'true':
              picked = list(clients)
          else:
              picked = [k for k in clients if str(ticked.get(k, '')).lower() == 'true']
          if not picked:
              raise SystemExit('No client selected — tick All or at least one client.')
          matrix = [
              {'key': k, 'label': v['label'], 'secret': v['secret']}
              for k, v in clients.items() if k in picked
          ]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"matrix={json.dumps(matrix)}\n")
          print(f"Selected: {', '.join(m['key'] for m in matrix)}")
          EOF

  deploy:
    name: Manual deploy
    needs: resolve
    runs-on: [ubuntu-latest]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Deploy ${{ matrix.label }}
        env:
          KEY: ${{ matrix.key }}
          LABEL: ${{ matrix.label }}
          SECRET_NAME: ${{ matrix.secret }}
          WEBHOOK_URL: ${{ secrets[matrix.secret] }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "No webhook secret $SECRET_NAME configured."
            exit 1
          fi
          echo "::add-mask::$WEBHOOK_URL"
          echo "Triggering Portainer Stack Redeploy for $LABEL..."
          RESPONSE_FILE="/tmp/response-${KEY}.txt"
          MAX_TRIES=3
          TRY=1
          HTTP_CODE=0
          while [ $TRY -le $MAX_TRIES ]; do
            echo "Attempt $TRY of $MAX_TRIES..."
            HTTP_CODE=$(curl -w "%{http_code}" -s -S -o "$RESPONSE_FILE" -X POST -k --max-time 30 "$WEBHOOK_URL") || HTTP_CODE=0
            echo "HTTP Status Code: $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Redeploy trigger ACCEPTED for $LABEL (HTTP $HTTP_CODE)."
              break
            fi
            if [ $TRY -lt $MAX_TRIES ]; then sleep $((2 ** (TRY - 1))); fi
            TRY=$((TRY + 1))
          done
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Trigger accepted (HTTP $HTTP_CODE). NOTE: this only means Portainer accepted the request — it does NOT prove the stack redeployed. Confirm the stack is actually up in the Portainer UI."
          else
            echo "Webhook request failed for $LABEL after ${MAX_TRIES} attempts! (HTTP $HTTP_CODE)"
            exit 1
          fi
