name: Build Images

# FULLY MANUAL — nothing runs on push. Dispatch this workflow by hand, tick
# what you need, and only that builds:
#   runner:  self-hosted (default — warm caches, no Hub rate-limit risk) or
#            github (ubuntu-latest, native amd64 = no emulation, but cold
#            cache on first run and shared-IP Docker Hub limits can bite)
#   all + backend/storefront/admin/pos: which images to build.
# Deployment stays manual too (Deploy Client workflow pulls these images).
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner for all jobs'
        required: false
        default: self-hosted
        type: choice
        options:
          - self-hosted
          - github
      all:
        description: 'Build ALL images?'
        required: false
        default: true
        type: boolean
      backend:
        description: 'Build backend image?'
        required: false
        default: false
        type: boolean
      storefront:
        description: 'Build storefront image?'
        required: false
        default: false
        type: boolean
      admin:
        description: 'Build admin image?'
        required: false
        default: false
        type: boolean
      pos:
        description: 'Build POS image?'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

# Overlapping manual runs would fight over the single self-hosted runner and
# could push interleaved tags — cancel the stale run.
concurrency:
  group: ci-manual
  cancel-in-progress: true

jobs:
  # Static data-safety gates. These run BEFORE the backend image is built, so a
  # destructive migration (DROP COLUMN / DELETE FROM / TRUNCATE on a post-P0
  # migration) can never reach the published image (deployment itself is manual,
  # so the gate only needs to protect the image).
  # Only needed when the backend image will actually rebuild.
  guards:
    name: static guards
    if: inputs.all == true || inputs.backend == true
    # fromJSON array literal: runs-on accepts an expression evaluating to labels.
    runs-on: ${{ fromJSON(inputs.runner == 'github' && '["ubuntu-24.04"]' || '["self-hosted", "macos", "arm64"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Migration-safety gate (no destructive post-P0 migrations)
        working-directory: apps/backend
        # Both suites are fs-only reads (no DB): migration-safety locks the
        # additive-migration rule, deploy-safety locks seed/boot repair gates.
        run: npx jest "(migration-safety|deploy-safety)"

  # Unit quality gate. Each suite runs only when its service was ticked.
  # Backend jest excludes the two `.integration.spec.ts` files, which need a
  # live database (verified: with a dead DATABASE_URL exactly those 2 suites
  # fail, the other 3964 pass) — so this job never touches any database and
  # cannot pollute dev data.
  unit:
    name: unit tests
    if: ${{ inputs.all == true || inputs.backend == true || inputs.storefront == true || inputs.admin == true || inputs.pos == true }}
    runs-on: ${{ fromJSON(inputs.runner == 'github' && '["ubuntu-24.04"]' || '["self-hosted", "macos", "arm64"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Backend unit tests
        if: inputs.all == true || inputs.backend == true
        working-directory: apps/backend
        run: |
          npx prisma generate
          # Workspace packages ship without dist/ on a fresh checkout
          # (npm ci --ignore-scripts skips their builds); the Dockerfiles build
          # them the same way before compiling the app.
          npx tsc -p ../../packages/shared-types/tsconfig.json
          npx tsc -p ../../packages/license-engine/tsconfig.json
          npx tsc -p ../../packages/feature-flags/tsconfig.json
          npx nest build
          npx jest --no-coverage --testPathIgnorePatterns "integration"

      - name: Storefront unit tests
        if: inputs.all == true || inputs.storefront == true
        working-directory: apps/storefront
        run: |
          npx tsc --noEmit
          npm test

      - name: Cache Playwright browsers
        # Fresh github runners re-download ~300MB (chromium + ffmpeg +
        # headless shell) on EVERY run; the self-hosted Mac has them
        # preinstalled. Key follows the lockfile so a Playwright bump
        # invalidates the cache automatically.
        if: inputs.all == true || inputs.admin == true
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Admin unit tests
        if: inputs.all == true || inputs.admin == true
        working-directory: apps/admin
        run: |
          # shared-types ships without dist/ on a fresh checkout (same reason
          # as backend above; the admin Dockerfile builds it explicitly too).
          npx tsc -p ../../packages/shared-types/tsconfig.json
          npx tsc --noEmit -p tsconfig.app.json
          # Vitest runs in real-chromium browser mode: browsers are preinstalled
          # on the self-hosted runner but missing on a fresh github runner.
          # Plain install (no --with-deps: that needs apt/sudo and breaks Mac).
          npx playwright install chromium
          npx vitest run

      - name: POS unit tests
        if: inputs.all == true || inputs.pos == true
        working-directory: apps/pos
        run: |
          npx tsc -b
          npx vite build

  # One caller per image. Each runs only when ticked; the backend keeps the
  # raised 360min timeout (slow ghcr.io uplink from the Mac), frontends 120.
  # All builds wait for the gates, so broken tests can no longer ship.
  build-backend:
    needs: [guards, unit]
    if: inputs.all == true || inputs.backend == true
    uses: ./.github/workflows/build-service-image.yml
    with:
      service: backend
      timeout-minutes: 360
      runners: ${{ inputs.runner == 'github' && '["ubuntu-latest"]' || '["self-hosted", "macos", "arm64"]' }}

  build-storefront:
    needs: [unit]
    if: inputs.all == true || inputs.storefront == true
    uses: ./.github/workflows/build-service-image.yml
    with:
      service: storefront
      runners: ${{ inputs.runner == 'github' && '["ubuntu-latest"]' || '["self-hosted", "macos", "arm64"]' }}

  build-admin:
    needs: [unit]
    if: inputs.all == true || inputs.admin == true
    uses: ./.github/workflows/build-service-image.yml
    with:
      service: admin
      runners: ${{ inputs.runner == 'github' && '["ubuntu-latest"]' || '["self-hosted", "macos", "arm64"]' }}

  build-pos:
    needs: [unit]
    if: inputs.all == true || inputs.pos == true
    uses: ./.github/workflows/build-service-image.yml
    with:
      service: pos
      runners: ${{ inputs.runner == 'github' && '["ubuntu-latest"]' || '["self-hosted", "macos", "arm64"]' }}
