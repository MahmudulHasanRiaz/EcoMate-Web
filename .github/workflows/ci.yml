name: Build Images

on:
  push:
    branches: [main]
    paths:
      - 'package*.json'
      - 'packages/**'
      - 'apps/backend/**'
      - 'apps/storefront/**'
      - 'apps/admin/**'
      - 'apps/pos/**'
      - '.dockerignore'
      - '.github/workflows/ci.yml'
      - '.github/workflows/build-service-image.yml'

permissions:
  contents: read
  packages: write

# A single self-hosted runner processes one job at a time, so rapid pushes to
# main would otherwise queue up every superseded build. Cancel the stale run;
# its `deploy` job is cancelled with it, so the stack never redeploys from a
# half-finished build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Per-service change detection. A push rebuilds ONLY the images whose inputs
  # changed — e.g. an admin-only commit rebuilds just the admin image instead
  # of all four (the backend image alone once died at the 2h timeout mid-push
  # with every step CACHED). Shared inputs (root package*.json, .dockerignore,
  # workflows) rebuild all services; packages/** rebuilds backend (it consumes
  # all three local packages) and admin (shared-types) but NOT storefront/pos,
  # which COPY no package from the host (verified against all Dockerfiles).
  changes:
    name: detect changes
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      storefront: ${{ steps.filter.outputs.storefront }}
      admin: ${{ steps.filter.outputs.admin }}
      pos: ${{ steps.filter.outputs.pos }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the filter diffs base...head, which a shallow
          # checkout cannot guarantee to contain.
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/**'
              - 'package*.json'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - '.github/workflows/build-service-image.yml'
            storefront:
              - 'apps/storefront/**'
              - 'package*.json'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - '.github/workflows/build-service-image.yml'
            admin:
              - 'apps/admin/**'
              - 'packages/shared-types/**'
              - 'package*.json'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - '.github/workflows/build-service-image.yml'
            pos:
              - 'apps/pos/**'
              - 'package*.json'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - '.github/workflows/build-service-image.yml'

  # Static data-safety gates. These run BEFORE the backend image is built, so a
  # destructive migration (DROP COLUMN / DELETE FROM / TRUNCATE on a post-P0
  # migration) can never reach the published image or the stack redeploy.
  # Only needed when the backend image will actually rebuild.
  guards:
    name: static guards
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Migration-safety gate (no destructive post-P0 migrations)
        working-directory: apps/backend
        # Both suites are fs-only reads (no DB): migration-safety locks the
        # additive-migration rule, deploy-safety locks seed/boot repair gates.
        run: npx jest "(migration-safety|deploy-safety)"

  # Unit quality gate. CI previously ran ZERO unit tests: a commit breaking
  # hundreds of jest/vitest cases still built, pushed and redeployed. Each
  # suite runs only when its service changed. Backend jest excludes the two
  # `.integration.spec.ts` files, which need a live database (verified: with a
  # dead DATABASE_URL exactly those 2 suites fail, the other 3964 pass) — so
  # this job never touches any database and cannot pollute dev data.
  unit:
    name: unit tests
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.storefront == 'true' || needs.changes.outputs.admin == 'true' || needs.changes.outputs.pos == 'true' }}
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Backend unit tests
        if: needs.changes.outputs.backend == 'true'
        working-directory: apps/backend
        run: |
          npx prisma generate
          npx nest build
          npx jest --no-coverage --testPathIgnorePatterns "integration"

      - name: Storefront unit tests
        if: needs.changes.outputs.storefront == 'true'
        working-directory: apps/storefront
        run: |
          npx tsc --noEmit
          npm test

      - name: Admin unit tests
        if: needs.changes.outputs.admin == 'true'
        working-directory: apps/admin
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npx vitest run

      - name: POS unit tests
        if: needs.changes.outputs.pos == 'true'
        working-directory: apps/pos
        run: |
          npx tsc -b
          npx vite build

  # One caller per image. Each runs only when its inputs changed; the backend
  # keeps the raised 360min timeout (slow ghcr.io uplink), frontends stay 120.
  # All builds wait for the unit gate, so broken tests can no longer ship.
  build-backend:
    needs: [changes, guards, unit]
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/build-service-image.yml
    with:
      service: backend
      timeout-minutes: 360

  build-storefront:
    needs: [changes, unit]
    if: needs.changes.outputs.storefront == 'true'
    uses: ./.github/workflows/build-service-image.yml
    with:
      service: storefront

  build-admin:
    needs: [changes, unit]
    if: needs.changes.outputs.admin == 'true'
    uses: ./.github/workflows/build-service-image.yml
    with:
      service: admin

  build-pos:
    needs: [changes, unit]
    if: needs.changes.outputs.pos == 'true'
    uses: ./.github/workflows/build-service-image.yml
    with:
      service: pos

  # Redeploys the Portainer stack AFTER images are pushed, so the stack can
  # never pick up half-built images (the "redeployed but still old code" race).
  # Runs only when at least one image was actually built (skipped builds don't
  # trigger a pointless redeploy); never on failure/cancel. Skips cleanly
  # when PORTAINER_WEBHOOK_ECOMATE_WEB is not configured.
  deploy:
    name: redeploy stack
    needs: [build-backend, build-storefront, build-admin, build-pos]
    if: ${{ !cancelled() && !failure() && (needs.build-backend.result == 'success' || needs.build-storefront.result == 'success' || needs.build-admin.result == 'success' || needs.build-pos.result == 'success') }}
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 15
    steps:
      - name: Trigger Portainer stack redeploy
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_ECOMATE_WEB }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "No PORTAINER_WEBHOOK_ECOMATE_WEB secret configured — skipping redeploy."
            exit 0
          fi
          MAX_TRIES=3
          TRY=1
          HTTP_CODE=0
          while [ $TRY -le $MAX_TRIES ]; do
            HTTP_CODE=$(curl -w "%{http_code}" -s -S -o /tmp/response.txt -X POST -k --max-time 30 "$WEBHOOK_URL") || HTTP_CODE=0
            echo "Attempt $TRY/$MAX_TRIES → HTTP $HTTP_CODE $(cat /tmp/response.txt 2>/dev/null || true)"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Stack redeploy triggered."
              exit 0
            fi
            if [ $TRY -lt $MAX_TRIES ]; then sleep $((2 ** (TRY - 1))); fi
            TRY=$((TRY + 1))
          done
          echo "Portainer webhook failed with HTTP $HTTP_CODE after $MAX_TRIES attempts."
          exit 1
