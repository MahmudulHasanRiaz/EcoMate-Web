name: Build Images

on:
  push:
    branches: [main]
    paths:
      - 'package*.json'
      - 'packages/**'
      - 'apps/backend/**'
      - 'apps/storefront/**'
      - 'apps/admin/**'
      - 'apps/pos/**'
      - '.dockerignore'
      - '.github/workflows/ci.yml'
      - '.github/workflows/build-service-image.yml'

permissions:
  contents: read
  packages: write

# A single self-hosted runner processes one job at a time, so rapid pushes to
# main would otherwise queue up every superseded build. Cancel the stale run.
# NOTE: CI never deploys — it only builds images. Deployment is manual via the
# "Deploy Client" workflow (tick one or more clients); Portainer then pulls the
# freshly built images.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Per-service change detection. A push rebuilds ONLY the images whose inputs
  # changed — e.g. an admin-only commit rebuilds just the admin image instead
  # of all four (the backend image alone once died at the 2h timeout mid-push
  # with every step CACHED). Shared inputs (root package*.json, .dockerignore,
  # workflows) rebuild all services; packages/** rebuilds backend (it consumes
  # all three local packages) and admin (shared-types) but NOT storefront/pos,
  # which COPY no package from the host (verified against all Dockerfiles).
  changes:
    name: detect changes
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      storefront: ${{ steps.filter.outputs.storefront }}
      admin: ${{ steps.filter.outputs.admin }}
      pos: ${{ steps.filter.outputs.pos }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the filter diffs base...head, which a shallow
          # checkout cannot guarantee to contain.
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/**'
              - 'package*.json'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - '.github/workflows/build-service-image.yml'
            storefront:
              - 'apps/storefront/**'
              - 'package*.json'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - '.github/workflows/build-service-image.yml'
            admin:
              - 'apps/admin/**'
              - 'packages/shared-types/**'
              - 'package*.json'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - '.github/workflows/build-service-image.yml'
            pos:
              - 'apps/pos/**'
              - 'package*.json'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - '.github/workflows/build-service-image.yml'

  # Static data-safety gates. These run BEFORE the backend image is built, so a
  # destructive migration (DROP COLUMN / DELETE FROM / TRUNCATE on a post-P0
  # migration) can never reach the published image (deployment itself is manual,
  # so the gate only needs to protect the image).
  # Only needed when the backend image will actually rebuild.
  guards:
    name: static guards
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Migration-safety gate (no destructive post-P0 migrations)
        working-directory: apps/backend
        # Both suites are fs-only reads (no DB): migration-safety locks the
        # additive-migration rule, deploy-safety locks seed/boot repair gates.
        run: npx jest "(migration-safety|deploy-safety)"

  # Unit quality gate. CI previously ran ZERO unit tests: a commit breaking
  # hundreds of jest/vitest cases still built and pushed its image. Each
  # suite runs only when its service changed. Backend jest excludes the two
  # `.integration.spec.ts` files, which need a live database (verified: with a
  # dead DATABASE_URL exactly those 2 suites fail, the other 3964 pass) — so
  # this job never touches any database and cannot pollute dev data.
  unit:
    name: unit tests
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.storefront == 'true' || needs.changes.outputs.admin == 'true' || needs.changes.outputs.pos == 'true' }}
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Backend unit tests
        if: needs.changes.outputs.backend == 'true'
        working-directory: apps/backend
        run: |
          npx prisma generate
          # Workspace packages ship without dist/ on a fresh checkout
          # (npm ci --ignore-scripts skips their builds); the Dockerfiles build
          # them the same way before compiling the app.
          npx tsc -p ../../packages/shared-types/tsconfig.json
          npx tsc -p ../../packages/license-engine/tsconfig.json
          npx tsc -p ../../packages/feature-flags/tsconfig.json
          npx nest build
          npx jest --no-coverage --testPathIgnorePatterns "integration"

      - name: Storefront unit tests
        if: needs.changes.outputs.storefront == 'true'
        working-directory: apps/storefront
        run: |
          npx tsc --noEmit
          npm test

      - name: Admin unit tests
        if: needs.changes.outputs.admin == 'true'
        working-directory: apps/admin
        run: |
          # shared-types ships without dist/ on a fresh checkout (same reason
          # as backend above; the admin Dockerfile builds it explicitly too).
          npx tsc -p ../../packages/shared-types/tsconfig.json
          npx tsc --noEmit -p tsconfig.app.json
          npx vitest run

      - name: POS unit tests
        if: needs.changes.outputs.pos == 'true'
        working-directory: apps/pos
        run: |
          npx tsc -b
          npx vite build

  # One caller per image. Each runs only when its inputs changed; the backend
  # keeps the raised 360min timeout (slow ghcr.io uplink), frontends stay 120.
  # All builds wait for the unit gate, so broken tests can no longer ship.
  build-backend:
    needs: [changes, guards, unit]
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/build-service-image.yml
    with:
      service: backend
      timeout-minutes: 360

  build-storefront:
    needs: [changes, unit]
    if: needs.changes.outputs.storefront == 'true'
    uses: ./.github/workflows/build-service-image.yml
    with:
      service: storefront

  build-admin:
    needs: [changes, unit]
    if: needs.changes.outputs.admin == 'true'
    uses: ./.github/workflows/build-service-image.yml
    with:
      service: admin

  build-pos:
    needs: [changes, unit]
    if: needs.changes.outputs.pos == 'true'
    uses: ./.github/workflows/build-service-image.yml
    with:
      service: pos
