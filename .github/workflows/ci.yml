name: Build Images

on:
  push:
    branches: [main]
    paths:
      - 'package*.json'
      - 'packages/**'
      - 'apps/backend/**'
      - 'apps/storefront/**'
      - 'apps/admin/**'
      - 'apps/pos/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  packages: write

# A single self-hosted runner processes one job at a time, so rapid pushes to
# main would otherwise queue up every superseded build. Cancel the stale run;
# its `deploy` job is cancelled with it, so the stack never redeploys from a
# half-finished build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static data-safety gates. These run BEFORE any image is built, so a
  # destructive migration (DROP COLUMN / DELETE FROM / TRUNCATE on a post-P0
  # migration) can never reach the published image or the stack redeploy.
  test:
    name: static guards
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Migration-safety gate (no destructive post-P0 migrations)
        working-directory: apps/backend
        run: npx jest migration-safety

  build:
    name: ${{ matrix.service }}
    needs: [test]
    runs-on: [self-hosted, macos, arm64]
    # The backend image is large (~230MB compressed) and this runner's uplink
    # to ghcr.io is slow; the 2026-10-04 backend job died at exactly 2h00m
    # mid-push with every build step CACHED (no code error). Give pushes room.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: [backend, storefront, admin, pos]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # The default `docker-container` driver is what actually pulls in the
          # multi-platform emulation support on Apple Silicon. The `docker`
          # driver falls back to the daemon's own binfmt handlers, which are not
          # guaranteed to cover linux/amd64.
          driver: docker-container

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ecomate-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          # Production runs on an amd64 VPS. This runner is arm64, so buildx
          # emulates the target architecture instead of producing a native
          # arm64 image the VPS could not run.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Redeploys the Portainer stack AFTER all images are pushed, so the stack can
  # never pick up half-built images (the "redeployed but still old code" race).
  # Skips cleanly when PORTAINER_WEBHOOK_ECOMATE_WEB is not configured.
  deploy:
    name: redeploy stack
    needs: build
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 15
    steps:
      - name: Trigger Portainer stack redeploy
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_ECOMATE_WEB }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "No PORTAINER_WEBHOOK_ECOMATE_WEB secret configured — skipping redeploy."
            exit 0
          fi
          MAX_TRIES=3
          TRY=1
          HTTP_CODE=0
          while [ $TRY -le $MAX_TRIES ]; do
            HTTP_CODE=$(curl -w "%{http_code}" -s -S -o /tmp/response.txt -X POST -k --max-time 30 "$WEBHOOK_URL") || HTTP_CODE=0
            echo "Attempt $TRY/$MAX_TRIES → HTTP $HTTP_CODE $(cat /tmp/response.txt 2>/dev/null || true)"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Stack redeploy triggered."
              exit 0
            fi
            if [ $TRY -lt $MAX_TRIES ]; then sleep $((2 ** (TRY - 1))); fi
            TRY=$((TRY + 1))
          done
          echo "Portainer webhook failed with HTTP $HTTP_CODE after $MAX_TRIES attempts."
          exit 1
