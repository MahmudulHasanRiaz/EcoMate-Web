name: Build service image

# Shared build logic for one service image (called by ci.yml with per-service
# path filtering, so a push rebuilds ONLY the images whose inputs changed).
# Behaviour is identical to the old matrix job: Buildx (docker-container
# driver for amd64 emulation on the arm64 runner) → push to GHCR with
# `latest` + short-sha tags → GHA layer cache scoped per service.
on:
  workflow_call:
    inputs:
      service:
        description: Service directory under apps/ and GHCR image suffix
        required: true
        type: string
      timeout-minutes:
        description: Job timeout; backend pushes ~230MB over a slow uplink
        required: false
        type: number
        default: 120
      runners:
        description: JSON label array for runs-on (caller maps its runner choice)
        required: false
        type: string
        default: '["self-hosted", "macos", "arm64"]'

jobs:
  build:
    name: ${{ inputs.service }}
    runs-on: ${{ fromJSON(inputs.runners) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # The default `docker-container` driver is what actually pulls in the
          # multi-platform emulation support on Apple Silicon. The `docker`
          # driver falls back to the daemon's own binfmt handlers, which are not
          # guaranteed to cover linux/amd64.
          driver: docker-container

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ecomate-${{ inputs.service }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ inputs.service }}/Dockerfile
          push: true
          # Production runs on an amd64 VPS. This runner is arm64, so buildx
          # emulates the target architecture instead of producing a native
          # arm64 image the VPS could not run.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
