# media-static: serves /uploads bytes with sendfile so image traffic never
# enters the backend Node process (Round-3 perf, 2026-11-03).
#
# Header parity with the backend's @fastify/static setup
# (apps/backend/src/main.ts) is REQUIRED — do not drift:
#   * every response: Content-Security-Policy: sandbox +
#     X-Content-Type-Options: nosniff (security audit F15 — stored HTML/SVG
#     must never execute from the media origin)
#   * /uploads/derivatives/*: Cache-Control public, max-age=31536000,
#     immutable (derivative bytes are keyed by media id and never change
#     in place)
#   * other originals: Cache-Control public, max-age=3600 (a local restore
#     can replace an original's bytes at the same URL — never pin those)
server {
    listen 80;
    server_name _;

    # Volume uploads-data is mounted at /srv/uploads (read-only).
    root /srv;

    sendfile on;
    tcp_nopush on;
    access_log off;

    location /uploads/derivatives/ {
        try_files $uri =404;
        add_header Content-Security-Policy "sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /uploads/ {
        try_files $uri =404;
        add_header Content-Security-Policy "sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        return 404;
    }
}
