server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Media uploads pass through /api/ (single up to 15MB, bulk up to 20 files).
    # Without this nginx rejects any request body over its default 1MB with 413
    # before the backend ever sees it. Backup location below overrides to 100g.
    client_max_body_size 300m;

    location /admin {
        try_files $uri $uri/ /admin/index.html;
    }

    location = / {
        return 301 /admin/;
    }

    # Large backup uploads and downloads are streamed end-to-end. Disabling
    # proxy buffering avoids a second full copy in nginx memory/temp storage.
    location ^~ /api/admin/backup {
        client_max_body_size 100g;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}
