server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Media uploads pass through /api/ (single up to 15MB, bulk up to 20 files).
    # Without this nginx rejects any request body over its default 1MB with 413
    # before the backend ever sees it. Backup location below overrides to 100g.
    client_max_body_size 300m;

    location /admin {
        try_files $uri $uri/ /admin/index.html;
    }

    # SW update path (D18): the service-worker script, its registration
    # snippet, and the app shell MUST revalidate on every request. Without
    # this, a browser can keep serving the previous deploy's cached
    # index.html + sw.js (heuristic caching on Last-Modified) and the new
    # bundle never reaches already-installed profiles — staff stay on the
    # old UI after a deploy with no error anywhere. Hashed /assets/ below
    # stay immutable; only these three unversioned files are no-cache.
    location = /admin/sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /admin/registerSW.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /admin/index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed build assets: immutable — content never changes, so the browser
    # must not even revalidate. This makes reloads instant after first visit.
    # gzip_static serves the build-time .gz files (no per-request CPU).
    location /admin/assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_static on;
        try_files $uri =404;
    }

    location = / {
        return 301 /admin/;
    }

    # Large backup uploads and downloads are streamed end-to-end. Disabling
    # proxy buffering avoids a second full copy in nginx memory/temp storage.
    location ^~ /api/admin/backup {
        client_max_body_size 100g;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Media uploads + long derivative processing must not hit the 60s
        # defaults: slow uplinks need time to push the body, the backend needs
        # time to answer. Stream the body straight through instead of buffering.
        client_body_timeout 600s;
        proxy_request_buffering off;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /uploads/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}
