<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>EcoMate POS</title>
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EcoMate POS" />
    <link rel="apple-touch-icon" href="/images/favicon.png" />

    <script>
      (function () {
        try {
          var apiBase = (function () {
            var configured = __POS_API_BASE__;
            return configured.replace(/\/+$/, "");
          })();
          fetch(apiBase + "/system-settings/branding", {
            credentials: "include",
            cache: "no-store",
          })
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .then(function (data) {
              if (!data) return;
              var favicon = data.adminFavicon || data.storefrontFavicon;
              if (favicon) {
                document
                  .querySelectorAll('link[rel="icon"]')
                  .forEach(function (l) {
                    l.setAttribute("href", favicon);
                  });
                var d = document.createElement("link");
                d.setAttribute("rel", "icon");
                d.setAttribute("href", favicon);
                document.head.appendChild(d);
              }
            })
            .catch(function () {});
        } catch (_) {}
      })();
    </script>

    <!--
      Resolve the license gate before main.tsx can register the POS service
      worker. A failed/unknown check leaves existing offline support alone but
      never creates a new registration. An explicit denial removes only the
      POS-scoped worker and manifest.
    -->
    <script>
      (function () {
        var allowPwa = function () {
          if (document.querySelector('link[rel="manifest"]')) return;
          var manifest = document.createElement("link");
          manifest.setAttribute("rel", "manifest");
          manifest.setAttribute("href", "/api/system-settings/pos-manifest");
          document.head.appendChild(manifest);
        };

        var denyPwa = function () {
          document
            .querySelectorAll('link[rel="manifest"]')
            .forEach(function (link) {
              link.remove();
            });

          if (!("serviceWorker" in navigator)) return;
          navigator.serviceWorker
            .getRegistrations()
            .then(function (registrations) {
              registrations.forEach(function (registration) {
                try {
                  var scopePath = new URL(registration.scope).pathname;
                  if (
                    scopePath === "/pos/" ||
                    scopePath.indexOf("/pos/") === 0
                  ) {
                    registration.unregister();
                  }
                } catch (_) {}
              });
            })
            .catch(function () {});
        };

        try {
          var apiBase = (function () {
            var configured = __POS_API_BASE__;
            return configured.replace(/\/+$/, "");
          })();
          var controller =
            typeof AbortController !== "undefined"
              ? new AbortController()
              : null;
          var timeout = window.setTimeout(function () {
            if (controller) controller.abort();
          }, 8000);

          window.__POS_PWA_LICENSE__ = fetch(apiBase + "/license/status", {
            credentials: "include",
            cache: "no-store",
            signal: controller ? controller.signal : undefined,
          })
            .then(function (response) {
              return response.ok ? response.json() : null;
            })
            .then(function (data) {
              window.clearTimeout(timeout);
              if (!data) return false;
              var features = data.features || [];
              var allowed =
                data.active === true &&
                (features.indexOf("*") !== -1 ||
                  features.indexOf("mobile_distribution") !== -1);
              if (!allowed) {
                denyPwa();
              } else {
                allowPwa();
              }
              return allowed;
            })
            .catch(function () {
              window.clearTimeout(timeout);
              return false;
            });
        } catch (_) {
          window.__POS_PWA_LICENSE__ = Promise.resolve(false);
        }
      })();
    </script>
  </head>
  <body class="bg-gray-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
